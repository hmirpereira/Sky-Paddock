# Sky Paddock: builds the site and publishes it on GitHub Pages at every push.
# The built site (docs/) is made here with Vite, so it does not need to be in the commits.
# Needs Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publish site

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# the job that installs the npm packages and runs their code only reads; only the deploy job may publish
permissions:
  contents: read

# one publication at a time; a newer push waits for the one running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # pinned: the 'ubuntu-latest' image moved on and the Chromium dependencies of the test stopped installing (the step failed in runs 130 to 132)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        # no install scripts: the build and the tests do not need them (the Chromium below is installed on its own)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint (stops here if the code has errors, so a broken page never reaches the TV)
        run: npm run lint
      - name: Unit tests (decoders, conversions, telemetry maths, text helpers)
        run: npm run test:unit
      - name: Build (Vite)
        run: npm run build
      - name: Check the build
        run: |
          test -s docs/index.html
          ls docs/assets/*.js docs/assets/*.css
          test -d docs/images/flags
          grep -q "$(node -p "require('./package.json').version")" docs/index.html
          # the Content-Security-Policy is in the page and there is no inline script (the policy would refuse it)
          grep -q 'http-equiv="Content-Security-Policy"' docs/index.html
          ! grep -q '<script>' docs/index.html
      - name: Install Chromium for the test
        run: npx playwright install chromium
      # the runner already has the libraries Chromium needs; the apt mirror of the runner has been unreachable, so this step is optional
      - name: Install the system libraries of Chromium (optional)
        continue-on-error: true
        run: sudo npx playwright install-deps chromium
      - name: Test every screen (recorded data; stops here if a screen fails or the page has an error)
        run: npx playwright test --project=smoke
      - name: Keep the test report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
